<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uma pergunta 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}

.card {
    width: 90%;
    max-width: 400px;
    padding: 30px 20px;
    text-align: center;
    background: white;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

h1 {
    color: #ff4f70;
    margin-bottom: 10px;
}

p {
    color: #555;
    font-size: 18px;
}

/* URSINHOS */
.ursos {
    font-size: 60px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    gap: 5px;
}

.urso {
    display: inline-block;
    animation: respirar 2s infinite ease-in-out;
}

@keyframes respirar {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

/* DANÇA */
.dancando {
    animation: danca .35s infinite alternate ease-in-out;
}

@keyframes danca {
    from {
        transform: rotate(-15deg) translateY(0);
    }

    to {
        transform: rotate(15deg) translateY(-12px);
    }
}

/* URSO BRAVO */
#bravo {
    display: none;
    font-size: 45px;
    margin-top: 5px;
    animation: bravo .25s infinite alternate;
}

@keyframes bravo {
    from {
        transform: rotate(-8deg);
    }

    to {
        transform: rotate(8deg);
    }
}

/* BOTÕES */
.botoes {
    margin-top: 25px;
    height: 120px;
    position: relative;
}

button {
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#sim {
    background: #ff4f70;
    color: white;
    position: absolute;
    left: 15%;
    top: 45px;
}

#nao {
    background: #555;
    color: white;
    position: absolute;
    left: 55%;
    top: 45px;
    transition: .15s;
}

#resultado {
    display: none;
    color: #ff4f70;
}

#resultado h1 {
    font-size: 30px;
}

.coracoes {
    font-size: 30px;
    animation: coracao 1s infinite alternate;
}

@keyframes coracao {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.2);
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- PERGUNTA -->
    <div id="pergunta">

        <div class="ursos" id="ursos">
            <span class="urso" id="urso1">🐻</span>
            <span class="urso" id="urso2">🐻</span>
        </div>

        <div id="bravo">
            😡🐻
        </div>

        <h1>Tenho uma pergunta... 💌</h1>

        <p>
            Você quer sair comigo? 👀❤️
        </p>

        <div class="botoes">

            <button id="sim" onclick="aceitou()">
                SIM ❤️
            </button>

            <button id="nao" onclick="naoAceitou()">
                NÃO 😭
            </button>

        </div>

    </div>

    <!-- RESULTADO -->
    <div id="resultado">

        <div class="ursos">
            <span class="urso dancando">🐻</span>
            <span class="urso dancando">🐻</span>
        </div>

        <h1>AAAAA 😭❤️</h1>

        <p>
            Então está marcado! 👀
        </p>

        <p>
            Agora falta escolher o lugar 😎
        </p>

        <div class="coracoes">
            ❤️ 💕 ❤️
        </div>

    </div>

</div>

<script>

const nao = document.getElementById("nao");
const bravo = document.getElementById("bravo");

function naoAceitou() {

    // mostra o ursinho bravo
    bravo.style.display = "block";

    // muda o texto do botão
    nao.innerHTML = "NÃO 😭";

    // faz o botão fugir
    const card = document.querySelector(".card");
    const botoes = document.querySelector(".botoes");

    const maxX = botoes.clientWidth - nao.offsetWidth;
    const maxY = botoes.clientHeight - nao.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    nao.style.left = x + "px";
    nao.style.top = y + "px";
}

function aceitou() {

    // esconde a pergunta
    document.getElementById("pergunta").style.display = "none";

    // mostra resultado
    document.getElementById("resultado").style.display = "block";
}

</script>

</body>
</html>
